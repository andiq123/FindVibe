<!doctype html>
<html lang="en" data-theme="vibenative">
  <head>
    <meta charset="utf-8" />
    <title>FindVibe</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="FindVibe - Discover and play your favorite music with an iOS-native experience"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="icons/icon-152x152.png"
    />

    <!-- DNS Prefetch and Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <link
      rel="preconnect"
      href="https://lh3.googleusercontent.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://jpg.muzjam.org" />
    <link rel="preconnect" href="https://jpg.muzjam.org" crossorigin />
    <link rel="dns-prefetch" href="https://song.muzvibe.org" />
    <link rel="preconnect" href="https://song.muzvibe.org" crossorigin />
    <link rel="dns-prefetch" href="https://mn1.sunproxy.net" />
    <link rel="preconnect" href="https://mn1.sunproxy.net" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#454057" />
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
