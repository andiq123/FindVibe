<nav class="nav-desktop" aria-label="Main navigation">
  <a class="nav-brand" routerLink="/explore" aria-label="FindVibe home">
    <img src="icons/icon.svg" alt="" width="38" height="38" />
    <span>FindVibe<small>Your music, everywhere.</small></span>
  </a>
  <p class="nav-caption">LIBRARY</p>
  @for (item of navList; track item.link) {
    <a [routerLink]="item.link" routerLinkActive="active-tab" ariaCurrentWhenActive="page" class="nav-desktop-item">
      <fa-icon [icon]="item.icon" /> <span>{{ item.name }}</span>
    </a>
  }
  <div class="nav-footer">A little more discovery.<br />A lot more you.</div>
</nav>
<nav class="nav-mobile" aria-label="Main navigation">
  @for (item of navList; track item.link) {
    <a [routerLink]="item.link" routerLinkActive="active-tab" ariaCurrentWhenActive="page" class="nav-mobile-item">
      <fa-icon [icon]="item.icon" />
      <span>{{ item.name }}</span>
    </a>
  }
</nav>
