<div class="flex flex-col items-center justify-center min-h-[80vh] w-full px-6 anim-fade-in">
  <div class="w-full max-w-sm login-card rounded-[2.5rem] p-10 flex flex-col gap-8 anim-slide-fade-in-up">
    <div class="flex flex-col items-center gap-4 anim-stagger">
      <img
        src="icons/icon.svg"
        alt=""
        width="72"
        height="72"
        class="w-[4.5rem] h-[4.5rem] rounded-[1.25rem] shadow-lg shadow-black/25"
      />
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold tracking-tight text-white">FindVibe</h1>
        <p class="text-white/40 text-sm">Your personal music collection</p>
      </div>
    </div>
    <form
      (ngSubmit)="setUpUser()"
      class="flex flex-col gap-6 anim-stagger"
    >
      <div class="space-y-2">
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white/30 ml-4 block">Identify Yourself</span>
        <div class="input-container flex items-center gap-3 rounded-[2rem] px-6 py-4">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            class="h-5 w-5 text-white/20"
          >
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z"
            />
          </svg>
          <input
            name="username"
            type="text"
            class="grow bg-transparent outline-none border-none text-white text-lg placeholder:text-white/10"
            placeholder="Name"
            [(ngModel)]="name"
            autocomplete="off"
            enterkeyhint="done"
          />
        </div>
      </div>
      <button
        class="btn-premium h-16 rounded-[2rem] text-lg active:scale-95 transition-all flex items-center justify-center gap-3"
        type="submit"
        [disabled]="!name() || loadingSubmiting()"
      >
        <span>Continue</span>
        @if(loadingSubmiting()){
          <span class="loading loading-spinner loading-md"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-40">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
          </svg>
        }
      </button>
    </form>
  </div>
</div>
