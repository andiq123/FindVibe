<div class="marquee-wrapper" #container [class.is-overflowing]="isOverflowing()">
  <div 
    class="marquee-content" 
    #content 
    [class.anim-marquee]="isOverflowing() && isActive()"
    [style.animation-duration]="animationDuration() + 's'"
  >
    <span 
      [class]="classes()"
      [style.font-size]="fontSize() || null"
      [style.color]="color() || null"
      [style.font-weight]="isBold() ? 'bold' : null"
    >{{ title() }}</span>
    @if (isOverflowing()) {
      <span class="marquee-spacer" aria-hidden="true"></span>
      <span aria-hidden="true"
        [class]="classes()"
        [style.font-size]="fontSize() || null"
        [style.color]="color() || null"
        [style.font-weight]="isBold() ? 'bold' : null"
      >{{ title() }}</span>
    }
  </div>
</div>
