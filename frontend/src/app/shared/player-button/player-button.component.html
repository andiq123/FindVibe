<div class="flex h-full items-center justify-center text-sm leading-none">
  @switch (status()) {
    @case (playerStatus.Playing) {
      <fa-icon [icon]="faPause" class="text-[0.95rem]" />
    }
    @case (playerStatus.Loading) {
      <span class="loading loading-spinner loading-xs"></span>
    }
    @case (playerStatus.Error) {
      <fa-icon [icon]="faArrowRotateRight" class="text-[0.95rem]" />
    }
    @default {
      <fa-icon [icon]="faPlay" class="text-[0.95rem] translate-x-px" />
    }
  }
</div>
